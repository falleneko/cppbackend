services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    volumes:
      - game-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # лучше буду использовать готовый, а собирать через ci
    image: gamesrv:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      GAME_DB_URL: postgresql://game:game@db:5432/game
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  game-db-data:
